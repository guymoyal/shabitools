<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- iziTools Logo - Modern, professional design representing developer tools -->
  
  <!-- Background circle with gradient -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient)" opacity="0.1"/>
  
  <!-- Main tool icon - Wrench/Gear combination -->
  <g transform="translate(100, 100)">
    <!-- Outer gear -->
    <path d="M 0 -50 L 8 -50 L 10 -42 L 18 -40 L 20 -32 L 28 -30 L 30 -22 L 38 -20 L 40 -12 L 48 -10 L 50 -2 L 50 2 L 48 10 L 40 12 L 38 20 L 30 22 L 28 30 L 20 32 L 18 40 L 10 42 L 8 50 L 0 50 L -8 50 L -10 42 L -18 40 L -20 32 L -28 30 L -30 22 L -38 20 L -40 12 L -48 10 L -50 2 L -50 -2 L -48 -10 L -40 -12 L -38 -20 L -30 -22 L -28 -30 L -20 -32 L -18 -40 L -10 -42 L -8 -50 Z" 
          fill="url(#primaryGradient)" 
          stroke="#0284c7" 
          stroke-width="2"/>
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="25" fill="white" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Wrench handle -->
    <rect x="-35" y="-3" width="20" height="6" rx="3" fill="#0284c7"/>
    <rect x="-15" y="-3" width="8" height="6" rx="3" fill="#0284c7" opacity="0.7"/>
    
    <!-- Small tools around -->
    <circle cx="-60" cy="-20" r="8" fill="#0284c7" opacity="0.6"/>
    <circle cx="60" cy="20" r="8" fill="#0284c7" opacity="0.6"/>
    <rect x="-65" y="15" width="10" height="10" rx="2" fill="#0284c7" opacity="0.6"/>
    <rect x="55" y="-25" width="10" height="10" rx="2" fill="#0284c7" opacity="0.6"/>
  </g>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
