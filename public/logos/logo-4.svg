  <circle cx="18" cy="20" r="4" fill="#0284c7"/>
  
  <!-- Snail Body -->
  <ellipse cx="32" cy="20" rx="5" ry="7" fill="#0ea5e9"/>
  <circle cx="34" cy="18" r="1.5" fill="#075985"/>
  
  <!-- Multiple Tools -->
