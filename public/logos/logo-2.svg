<svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Snail with gear shell -->
  <g transform="translate(20, 20)">
    <!-- Gear -->
    <circle cx="0" cy="0" r="10" fill="#0284c7" opacity="0.15"/>
    <circle cx="0" cy="0" r="8" fill="#0284c7"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    <!-- Gear teeth -->
    <rect x="-1" y="-12" width="2" height="4" fill="#0284c7"/>
    <rect x="-1" y="8" width="2" height="4" fill="#0284c7"/>
    <rect x="-12" y="-1" width="4" height="2" fill="#0284c7"/>
    <rect x="8" y="-1" width="4" height="2" fill="#0284c7"/>
    <rect x="-8.5" y="-8.5" width="2" height="4" fill="#0284c7" transform="rotate(45)"/>
    <rect x="6.5" y="6.5" width="2" height="4" fill="#0284c7" transform="rotate(45)"/>
    <rect x="6.5" y="-8.5" width="2" height="4" fill="#0284c7" transform="rotate(-45)"/>
    <rect x="-8.5" y="6.5" width="2" height="4" fill="#0284c7" transform="rotate(-45)"/>
  </g>
  
  <!-- Snail Body -->
  <ellipse cx="35" cy="20" rx="5" ry="7" fill="#0ea5e9"/>
  <circle cx="37" cy="18" r="1.5" fill="#075985"/>
  
  <!-- Hammer -->
  <rect x="48" y="14" width="6" height="2" fill="#0284c7"/>
  <rect x="50" y="10" width="2" height="6" fill="#0284c7"/>
  
  <!-- Screwdriver -->
  <rect x="58" y="12" width="1.5" height="8" fill="#0284c7"/>
  <rect x="56" y="12" width="5" height="1.5" fill="#0284c7"/>
  
  <!-- Text -->
  <text x="68" y="26" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0284c7">iziTools</text>
</svg>
