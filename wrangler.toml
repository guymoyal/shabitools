name = "shabitools"
compatibility_date = "2024-01-01"

# Cloudflare Pages configuration
# For Next.js SSG with output: 'export', the build output is in 'out' directory
pages_build_output_dir = "out"

# NOTE: the Pages project's PRODUCTION branch is "master" (not "main").
# Deploy production with: wrangler pages deploy out --branch master
# Secrets (production env, set via `wrangler pages secret put ... --project-name shabitools`):
#   DEEPSEEK_API_KEY, AMAZON_ASSOCIATES_TAG, ADVISOR_SOURCE
# (No [env.production]/[env.preview] sections — they don't inherit the d1 binding below.)

[[d1_databases]]
binding = "DB"
database_name = "shabitools-advisor"
database_id = "2378b4d2-51c5-4289-be79-6d6780b0f1e5"
