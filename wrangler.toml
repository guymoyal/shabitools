name = "shabitools"
compatibility_date = "2024-01-01"

# Cloudflare Pages configuration
# For Next.js SSG with output: 'export', the build output is in 'out' directory
pages_build_output_dir = "out"

[env.production]
name = "shabitools-production"

[env.preview]
name = "shabitools-preview"

# Environment variables (set via Cloudflare dashboard or CLI)
# [vars]
# NODE_ENV = "production"

[[d1_databases]]
binding = "DB"
database_name = "shabitools-advisor"
database_id = "2378b4d2-51c5-4289-be79-6d6780b0f1e5"
